services:
  - type: web
    name: playlistpilot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt gunicorn && python scripts/init_db.py && python scripts/seed_demo_data.py
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_RETRY
        value: "true"
      - key: MAX_RETRIES
        value: "3"
      - key: QUEUE_POLL_INTERVAL
        value: "2"
