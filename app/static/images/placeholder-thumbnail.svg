<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>

    <!-- Bevel & Shadow Filter -->
    <filter id="drop3D" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="redBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="40%" stop-color="#E62117"/>
      <stop offset="100%" stop-color="#A5120B"/>
    </linearGradient>

    <linearGradient id="metalBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#1E1E1E"/>
    </linearGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="480" height="270" fill="url(#bgGrad)"/>

  <!-- Subtle 3D Grid Accent -->
  <g stroke="#333333" stroke-width="1" opacity="0.35">
    <line x1="0" y1="45" x2="480" y2="45" />
    <line x1="0" y1="90" x2="480" y2="90" />
    <line x1="0" y1="135" x2="480" y2="135" />
    <line x1="0" y1="180" x2="480" y2="180" />
    <line x1="0" y1="225" x2="480" y2="225" />
    <line x1="80" y1="0" x2="80" y2="270" />
    <line x1="160" y1="0" x2="160" y2="270" />
    <line x1="240" y1="0" x2="240" y2="270" />
    <line x1="320" y1="0" x2="320" y2="270" />
    <line x1="400" y1="0" x2="400" y2="270" />
  </g>

  <!-- Raised Central Plate with Bevel -->
  <rect x="140" y="55" width="200" height="140" rx="16" fill="url(#cardGrad)" filter="url(#drop3D)"/>
  <rect x="140" y="55" width="200" height="140" rx="16" fill="none" stroke="url(#metalBevel)" stroke-width="2"/>

  <!-- 3D Red Play Button Disc -->
  <g filter="url(#drop3D)" transform="translate(240, 125)">
    <!-- Base shadow ring -->
    <circle cx="0" cy="0" r="42" fill="#88100A"/>
    <!-- Dimensional Face -->
    <circle cx="0" cy="-2" r="40" fill="url(#redBadge)"/>
    <!-- Highlight Ring -->
    <circle cx="0" cy="-2" r="39" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Tactile Play Triangle -->
    <path d="M -10 -16 L 16 0 L -10 16 Z" fill="#FFFFFF" filter="drop-shadow(0px 2px 3px rgba(0,0,0,0.4))"/>
  </g>

  <!-- Branding Accent -->
  <text x="240" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#808080" text-anchor="middle" letter-spacing="2">PLAYLISTPILOT</text>
  <rect x="210" y="235" width="60" height="3" rx="1.5" fill="#E62117"/>
</svg>
