version: '3.8'

services:
  playlistpilot:
    build: .
    container_name: playlistpilot_app
    ports:
      - "5000:5000"
    volumes:
      - ./instance:/app/instance
      - ./downloads:/app/downloads
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=production-secret-key-change-me
      - AUTO_RETRY=true
      - MAX_RETRIES=3
    restart: unless-stopped
